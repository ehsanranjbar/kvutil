name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test the vector kernels of the simd package
        env:
          GOEXPERIMENT: simd
        run: go vet ./vector/... && go test -race ./vector/...
      - name: Test the example
        working-directory: examples/petstore
        run: go vet ./... && go test -race ./...
      - name: Test the benchmarks (no Docker needed)
        working-directory: bench
        run: go vet ./... && go build ./... && go test ./...
      - name: Test the formats of the values (a module of its own)
        working-directory: bench/formats
        run: go vet ./... && go test ./...
