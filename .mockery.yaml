template: testify
filename: "mock_{{.InterfaceName | snakecase}}.go"
structname: "Mock{{.InterfaceName}}"
pkgname: "mocks"
dir: "testutil/mocks"
packages:
  github.com/ehsanranjbar/kvutil/indexing:
    interfaces:
      Indexer:
      ValueRetriever:
  github.com/ehsanranjbar/kvutil/schema:
    interfaces:
      PathExtractor:
  # ext.Extension is a generic type alias, which mockery v3.8.0 generates without its type
  # parameters. testutil/mocks/mock_extension.go is kept as it was generated before.
